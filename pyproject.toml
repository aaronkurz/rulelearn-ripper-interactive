[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rulelearn"
version = "0.2.3"
requires-python = ">=3.6"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "numba",
    "matplotlib",
    "cvxpy",
    "nyoka==5.4.0",
    "xmltodict",
    "torch",
]

[tool.setuptools.packages.find]
include = ["rulelearn*"]
